<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="Submission deadlines, review phases, dates and locations of the main A*/A conferences in machine learning, AI, NLP, vision, data mining and databases. Subscribe in your calendar.">

<meta name="google-site-verification" content="tQn860gtZTyTeX4KNDetB0hf03Wg_ztOCes29v9D6dY">

<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:site_name" content="ML Deadlines">
<meta property="og:title" content="ML Deadlines">
<meta property="og:description" content="Deadlines, review phases, dates and locations of the main A*/A conferences in ML, AI, NLP, vision, data mining and databases, on one timeline.">
<meta property="og:url" content="https://ambress92.github.io/ml-deadlines/">
<meta property="og:image" content="https://ambress92.github.io/ml-deadlines/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="ML Deadlines: conference deadlines on one timeline">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>ML Deadlines</h1>
      <p class="sub">Submission deadlines, review phases, dates and locations of the main A*/A conferences in machine learning, AI, NLP, vision, data mining and databases.</p>
    </div>
    <div class="head-actions">
      <button class="btn" id="sub-all" data-sub="all">Subscribe to all deadlines</button>
      <div class="tz" id="tz"></div>
    </div>
  </header>

  <div class="controls">
    <div class="seg" role="group" aria-label="View">
      <button id="v-timeline" data-view="timeline" aria-pressed="true">Timeline</button>
      <button id="v-list" data-view="list" aria-pressed="false">List</button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Area"></div>
    <label class="check"><input type="checkbox" id="show-est" checked> Show estimated dates</label>
  </div>

  <div class="legend" id="legend">
    <span><i class="sw dia hollow"></i>Abstract</span>
    <span><i class="sw dia"></i>Paper</span>
    <span><i class="sw bar" style="background:var(--review)"></i>Under review</span>
    <span><i class="sw bar" style="background:var(--rebuttal);height:5px"></i>Rebuttal</span>
    <span><i class="sw ring"></i>Commitment (ARR)</span>
    <span><i class="sw dot"></i>Notification</span>
    <span><i class="sw sq"></i>Camera-ready</span>
    <span><i class="sw bar" style="background:var(--conf)"></i>Conference</span>
    <span><i class="sw bar" style="border:1.5px dashed var(--faint)"></i>Estimated from last year</span>
  </div>

  <main id="view"></main>

  <div class="rolling" id="rolling" hidden></div>

  <footer id="footer"></footer>
</div>
<div id="tip" hidden></div>
<div id="toast" hidden></div>
<div class="menu" id="menu" hidden></div>
<script>window.__DATA__ = /*__DATA__*/null;</script>
<script src="app.js"></script>
<script data-goatcounter="https://ml-deadlines.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
